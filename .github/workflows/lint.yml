name: lint

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: bash -n syntax check
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if ! bash -n "$f"; then
              echo "::error file=$f::bash -n syntax error"
              fail=1
            fi
          done < <(find installer scripts -type f \( -name '*.sh' -o -name '*.bash' -o -name '*.tmpl' \) -print0)
          exit "$fail"

      - name: shellcheck
        run: |
          set -euo pipefail
          find installer scripts -type f \( -name '*.sh' -o -name '*.bash' -o -name '*.tmpl' \) -print0 |
            xargs -0 shellcheck

      - name: installer fetch-list manifest
        run: bash scripts/test/check-installer-manifest.sh

      - name: journald drop-in idempotency
        run: bash scripts/test/check-journald-idempotent.sh

      - name: render server quadlet
        run: bash scripts/test/check-render-quadlet.sh
