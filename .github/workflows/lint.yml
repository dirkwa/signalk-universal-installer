name: lint

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# One run per ref. Pushing a branch that has an open PR previously fired two
# identical runs (push + pull_request) on the same commit, doubling the work
# and the flake surface — on 2026-08-18 the pair split, the pull_request run
# passing in 23s while the push run wedged for 42 minutes on an apt mirror.
# `cancel-in-progress` also supersedes an in-flight run when new commits land,
# so a branch under active rebase does not keep stale jobs alive.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    # The whole suite finishes in ~1-2 minutes. 15 gives generous headroom
    # while ensuring a wedged step fails in minutes instead of occupying a
    # runner until the 6-hour default expires.
    timeout-minutes: 15
    steps:
      # Full history + tags: check-pages-version.sh resolves version tags and
      # creates throwaway worktrees at specific commits, neither of which works
      # in the default shallow, tagless checkout.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ubuntu-latest ships shellcheck preinstalled (0.9.0 as of 2026-08),
      # so the previous unconditional `apt-get update && apt-get install`
      # reached out to every configured mirror only to report "shellcheck is
      # already the newest version". That pointless network round-trip is
      # exactly what hung for 42 minutes on 2026-08-18. Use what is on the
      # image; only fall back to apt when it is genuinely missing, and bound
      # both the step and the apt calls so a stalled mirror fails fast
      # instead of hanging the job.
      - name: Install shellcheck
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck present: $(shellcheck --version | awk '/^version:/{print $2}')"
            exit 0
          fi
          echo "shellcheck not on the image — installing"
          sudo timeout -k 30 120 apt-get update
          sudo timeout -k 30 180 apt-get install -y --no-install-recommends shellcheck
          shellcheck --version

      - name: bash -n syntax check
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if ! bash -n "$f"; then
              echo "::error file=$f::bash -n syntax error"
              fail=1
            fi
          done < <(find installer scripts .devcontainer dev -type f \( -name '*.sh' -o -name '*.bash' -o -name '*.tmpl' \) \
            -not -path '.devcontainer/.devpod-internal/*' -not -path 'dev/signalk-server/*' -not -path 'dev/plugins/*' -not -path 'dev/companions/*' -not -path '*/node_modules/*' -print0)
          exit "$fail"

      - name: shellcheck
        run: |
          set -euo pipefail
          find installer scripts .devcontainer dev -type f \( -name '*.sh' -o -name '*.bash' -o -name '*.tmpl' \) \
            -not -path '.devcontainer/.devpod-internal/*' -not -path 'dev/signalk-server/*' -not -path 'dev/plugins/*' -not -path 'dev/companions/*' -not -path '*/node_modules/*' -print0 |
            xargs -0 shellcheck

      - name: installer fetch-list manifest
        run: bash scripts/test/check-installer-manifest.sh

      - name: bug-report container discovery
        run: bash scripts/test/check-bug-report-containers.sh

      - name: journald drop-in idempotency
        run: bash scripts/test/check-journald-idempotent.sh

      - name: app.slice CPU priority drop-in
        run: bash scripts/test/check-cpu-priority-dropin.sh

      - name: render server quadlet
        run: bash scripts/test/check-render-quadlet.sh

      - name: render-server refresh (issue #217)
        run: bash scripts/test/check-render-server.sh

      - name: hardware.json operator-toggle merge
        run: bash scripts/test/check-hardware-merge.sh

      - name: HALPI2 board detection ladder
        run: bash scripts/test/check-halpi2-detect.sh

      - name: HALPI2 apply (config.txt block, packages, network files)
        run: bash scripts/test/check-halpi2-config.sh

      - name: HALPI2 Signal K connections
        run: bash scripts/test/check-halpi2-connections.sh

      - name: timesync restart gating
        run: bash scripts/test/check-timesync-restart.sh

      - name: resolv-watch DNS self-heal
        run: bash scripts/test/check-resolv-watch.sh

      - name: pasta route gate (issue #250)
        run: bash scripts/test/check-pasta-route-gate.sh

      - name: pasta gateway self-heal (issue #250)
        run: bash scripts/test/check-netgate-watch.sh

      - name: orphan container detection
        run: bash scripts/test/check-orphan-detection.sh

      - name: precise port-conflict check
        run: bash scripts/test/check-port-precise.sh

      - name: privileged-port prompt skip
        run: bash scripts/test/check-priv-ports-skip-prompt.sh

      - name: supported-distro matrix
        run: bash scripts/test/check-supported-distro.sh

      - name: tmpfs /tmp warning decision table
        run: bash scripts/test/check-tmpfs-warn.sh

      - name: dbus-auth-proxy image pin sync
        run: bash scripts/test/check-proxy-image-sync.sh

      - name: signalk restart verb
        run: bash scripts/test/check-signalk-restart.sh

      - name: curl HTTP-status capture
        run: bash scripts/test/check-curl-status-capture.sh

      - name: Pages installer-version label
        run: bash scripts/test/check-pages-version.sh

      - name: site release/master channels
        run: bash scripts/test/check-site-channels.sh

      - name: staged installer payload runnable
        run: bash scripts/test/check-payload-runnable.sh

      - name: podman probe timeout guards
        run: bash scripts/test/check-podman-timeout-guards.sh

      - name: preflight survives a wedged podman
        run: bash scripts/test/check-preflight-podman-hang.sh

      - name: unwedge-podman storage-lock recovery
        run: bash scripts/test/check-unwedge-podman.sh

      - name: podman migrate namespace window
        run: bash scripts/test/check-migrate-pause-window.sh

      - name: Windows shim generation
        run: bash scripts/test/check-windows-shim.sh

      # install.ps1 is not shellcheck-able and had no syntax gate at all, so a
      # broken here-string or an unbalanced brace could ship. pwsh is present on
      # ubuntu-latest, and the parser runs without executing anything.
      #
      # This checks BOTH files that matter: install.ps1 itself, and the
      # signalk-run.ps1 it generates - the generated one is where the escaping
      # hazards land, and it is not otherwise parsed until it reaches a user's
      # machine. It is a syntax gate, not a correctness gate: an unescaped $
      # still yields valid PowerShell (see check-windows-shim.sh for that).
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'installer/windows/install.ps1'
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile($src, [ref]$null, [ref]$errs) | Out-Null
          if ($errs) {
              $errs | ForEach-Object { Write-Host "::error file=$src,line=$($_.Extent.StartLineNumber)::$($_.Message)" }
              exit 1
          }
          Write-Host "$src parses clean"

          # Render the generated shim the way install.ps1 does, then parse it.
          $lines = Get-Content $src
          $start = ($lines | Select-String -Pattern '^\$ps1Body = @"' | Select-Object -First 1).LineNumber
          $end   = ($lines | Select-String -Pattern '^"@' | Where-Object { $_.LineNumber -gt $start } | Select-Object -First 1).LineNumber
          if (-not $start -or -not $end) { Write-Host '::error::could not locate the $ps1Body here-string'; exit 1 }
          $MachineName = 'signalk'
          $Channel = 'release'
          $SignalkPorts = @(80, 443, 3000, 3443, 3003, 3004)
          $rendered = $ExecutionContext.InvokeCommand.ExpandString(($lines[$start..($end - 2)] -join "`n"))
          $gerrs = $null
          [System.Management.Automation.Language.Parser]::ParseInput($rendered, [ref]$null, [ref]$gerrs) | Out-Null
          if ($gerrs) {
              $gerrs | ForEach-Object { Write-Host "::error file=$src::generated signalk-run.ps1 line $($_.Extent.StartLineNumber): $($_.Message)" }
              exit 1
          }
          Write-Host 'generated signalk-run.ps1 parses clean'
