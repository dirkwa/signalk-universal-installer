# Devpod release channel: every version tag (vX.Y.Z) force-updates the
# 'release' branch to the tagged commit. `signalk devpod up` clones
# @release, so master can break between tags without breaking new dev
# workspaces. Tagging IS the release act; rollback = re-run manually
# (Actions -> release-branch -> Run workflow) with an earlier tag.
# The dotted pattern, not plain v*: the repo also carries non-version
# v-tags (v1-keeper-final) that must never become the channel content —
# and a bare v[0-9]* glob would still match them.
name: release-branch

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag (vX.Y.Z) to point the release branch at'
        required: true

# Serialize updates: each run force-pushes, so an older run finishing
# last must not overwrite a newer release. Queued, never cancelled —
# a manual rollback dispatched after a tag run must still apply.
concurrency:
  group: release-branch
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    # Job-scoped on purpose: only this job may write the release ref.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full fetch so any existing tag can be resolved and verified,
          # not just the ref that triggered the run.
          fetch-depth: 0

      - name: Advance release branch to the tag
        id: tag
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$TAG_INPUT"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          # Only real version tags may become the channel content — a
          # typo, a branch name, or a non-version v-tag (v1-keeper-final)
          # here would hand every `signalk devpod up` a non-release tree.
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Refusing: '$tag' is not a vX.Y.Z version tag" >&2; exit 1 ;;
          esac
          if ! sha="$(git rev-parse --verify --quiet "refs/tags/${tag}^{commit}")"; then
            echo "Refusing: tag '$tag' does not exist" >&2
            exit 1
          fi
          git push origin "+${sha}:refs/heads/release"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # A GitHub Release turns the bare tag into a changelog: every PR
      # merged since the previous version tag, auto-generated. Creating
      # a Release fires no tag-push workflows, so the channel and Pages
      # logic above stay untouched. The guard keeps manual rollback
      # dispatches (tag already released) from failing or duplicating.
      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — leaving it as is."
          else
            gh release create "$TAG" --verify-tag --generate-notes
          fi
