name: Publish installer to GitHub Pages

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

# Native GitHub Pages deploy: upload-pages-artifact + deploy-pages both
# run on Node 24, replacing the peaceiris third-party action (Node 20)
# and the auto-triggered `pages-build-deployment` workflow GitHub fired
# whenever we pushed to the gh-pages branch. The repo's Pages source
# must be set to "GitHub Actions" in Settings → Pages for this to take
# effect; the prior "Deploy from a branch" setting keeps firing the
# legacy built-in workflow on top of ours.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Bound the job so a wedged step fails in minutes rather than holding a
    # runner until the 6-hour default expires. Real builds run 24-48s, so 15
    # is ~20x headroom.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The site's index.html is rendered from the README by
      # scripts/render-index.ts. Installed once at the repo root: the staging
      # step runs against detached worktrees of the tag and of master, and
      # neither carries node_modules, so both point RENDER_ROOT here.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      # npm >= 12 skips dependency install scripts by default. tsx's esbuild
      # resolves its binary from an optional platform package on the runner's
      # linux-x64, so no postinstall is needed -- assert it rather than trust
      # it, since a silent failure here publishes a site with no landing page.
      - run: npm ci
      - run: node_modules/.bin/tsx --version

      # The label comes from the COMMIT, not from the ref that triggered this
      # run — see scripts/installer-version.sh for why (a release publishes the
      # same commit twice, and the two runs must agree or the last writer
      # mislabels the release). Shared with check-pages-version.sh so the test
      # exercises this logic rather than a copy of it.
      #
      # GITHUB_REF_NAME wins when a tag triggered the run: that run is
      # authoritative by definition, and it closes the residual window where a
      # master run started before the tag reached the remote and so cannot see
      # it even after fetching.
      - name: Compute installer version
        id: ver
        run: |
          set -euo pipefail
          # Ask the helper what counts as a release tag rather than restating
          # the rule here — one definition, nothing to drift.
          release_re="$(bash scripts/installer-version.sh --release-tag-pattern)"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$GITHUB_REF_NAME" =~ $release_re ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(bash scripts/installer-version.sh)"
          fi
          echo "Installer version: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Two channels from one deploy: the latest RELEASE tag at the site root,
      # master under /dev. Both the bash one-liner and the doctor's
      # /api/installer/refresh read the site root, so publishing the release
      # there is what makes `curl … | bash` and `signalk update` follow releases
      # instead of whatever landed on master minutes ago -- with no change
      # needed in the doctor.
      #
      # Every deploy rebuilds BOTH trees, whichever ref triggered it, so the two
      # can never drift apart or half-publish. fetch-depth: 0 above is what
      # makes the other ref reachable.
      - name: Resolve the release tag
        id: rel
        run: |
          set -euo pipefail
          release_re="$(bash scripts/installer-version.sh --release-tag-pattern)"
          tag="$(git tag --list 'v*' --sort=-v:refname | grep -E "$release_re" | head -1 || true)"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ -z "$tag" ]]; then
            echo "No release tag yet — the site root will carry master."
          else
            echo "Release tag: $tag"
          fi

      - name: Stage both channels
        env:
          RELEASE_TAG: ${{ steps.rel.outputs.release_tag }}
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist

          # /dev always carries master, labelled from THAT worktree.
          #
          # Deriving it from the triggering ref would be wrong on a tag run:
          # steps.ver reports the release tag there, so master's code would be
          # published under the release's version number whenever master had
          # moved on past the tag. Each tree's label has to come from the tree
          # it describes, or `signalk version` lies about what is installed --
          # the same class of bug installer-version.sh already carries a scar
          # from, just multiplied by two channels.
          # Resolve the master ref explicitly and fail loudly if it is not
          # there. actions/checkout with fetch-depth: 0 fetches all branches, so
          # it should always be -- but if that ever changes, the alternatives
          # are publishing the release tree at /dev (wrong content, silent) or
          # omitting /dev entirely (a 404 nobody notices until they need it).
          # A red workflow is the only failure mode here that gets looked at.
          dev_ref=origin/master
          if ! git rev-parse --verify --quiet "$dev_ref" >/dev/null; then
            dev_ref=master
          fi
          if ! git rev-parse --verify --quiet "$dev_ref" >/dev/null; then
            echo "::error::cannot resolve master for the /dev channel — refusing to publish a wrong or missing /dev"
            exit 1
          fi
          git worktree add --detach .site-dev "$dev_ref"
          dev_version="$(cd .site-dev && bash scripts/installer-version.sh)"
          bash scripts/stage-site.sh .site-dev dist/dev "$dev_version"

          if [[ -n "$RELEASE_TAG" ]]; then
            # Root carries the release, labelled with the bare tag.
            git worktree add --detach .site-rel "$RELEASE_TAG"
            bash scripts/stage-site.sh .site-rel dist "${RELEASE_TAG#v}"
          else
            # Never publish an empty root: with no release yet, master is the
            # best available answer and a broken one-liner is not acceptable.
            bash scripts/stage-site.sh .site-dev dist "$dev_version"
          fi

          echo "--- published tree ---"
          echo "  root: $(sed -n 's/.*INSTALLER_VERSION:-\([^}]*\)}.*/\1/p' dist/installer/linux/install.sh | head -1)"
          echo "  dev : $(sed -n 's/.*INSTALLER_VERSION:-\([^}]*\)}.*/\1/p' dist/dev/installer/linux/install.sh | head -1)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Bound the job so a wedged step fails in minutes rather than
    # holding a runner until the 6-hour default expires.
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
