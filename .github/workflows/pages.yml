name: Publish installer to GitHub Pages

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

# Native GitHub Pages deploy: upload-pages-artifact + deploy-pages both
# run on Node 24, replacing the peaceiris third-party action (Node 20)
# and the auto-triggered `pages-build-deployment` workflow GitHub fired
# whenever we pushed to the gh-pages branch. The repo's Pages source
# must be set to "GitHub Actions" in Settings → Pages for this to take
# effect; the prior "Deploy from a branch" setting keeps firing the
# legacy built-in workflow on top of ours.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The label comes from the COMMIT, not from the ref that triggered this
      # run — see scripts/installer-version.sh for why (a release publishes the
      # same commit twice, and the two runs must agree or the last writer
      # mislabels the release). Shared with check-pages-version.sh so the test
      # exercises this logic rather than a copy of it.
      #
      # GITHUB_REF_NAME wins when a tag triggered the run: that run is
      # authoritative by definition, and it closes the residual window where a
      # master run started before the tag reached the remote and so cannot see
      # it even after fetching.
      - name: Compute installer version
        id: ver
        run: |
          set -euo pipefail
          # Ask the helper what counts as a release tag rather than restating
          # the rule here — one definition, nothing to drift.
          release_re="$(bash scripts/installer-version.sh --release-tag-pattern)"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$GITHUB_REF_NAME" =~ $release_re ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(bash scripts/installer-version.sh)"
          fi
          echo "Installer version: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Stage dist/
        env:
          INSTALLER_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -r installer dist/
          cp -r quadlets dist/
          [ -d scripts ] && cp -r scripts dist/
          [ -d docs ] && cp -r docs dist/
          cp README.md dist/index.md

          # Inject version into shell + powershell installers and *.tmpl
          # dispatcher templates. The .tmpl files are fetched verbatim by the
          # doctor's /api/installer/refresh, so baking the version in here
          # means `signalk version` reports the same value after a refresh
          # as after a fresh bootstrap. The bash one-liner's install-time
          # substitution becomes a no-op against the published artifact and
          # still works against a local checkout (where the placeholder is
          # untouched).
          find dist/installer -type f \( -name '*.sh' -o -name '*.ps1' -o -name '*.tmpl' \) -print0 |
            xargs -0 sed -i "s|INSTALLER_VERSION:-0.0.0-scaffold|INSTALLER_VERSION:-${INSTALLER_VERSION}|g; s|'0.0.0-scaffold'|'${INSTALLER_VERSION}'|g; s|__SK_VERSION__|${INSTALLER_VERSION}|g"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
